name: FlexiMetronom APK erstellen

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projekt herunterladen
        uses: actions/checkout@v4

      - name: Java installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Gradle installieren
        uses: gradle/actions/setup-gradle@v4

      - name: Android-Projekt bauen
        run: gradle assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: FlexiMetronom-debug-apk
          path: app/build/outputs/apk/debug/*.apk
